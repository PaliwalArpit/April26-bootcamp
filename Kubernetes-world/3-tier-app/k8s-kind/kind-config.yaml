# kind cluster for the 3-tier-app assignment: 1 control-plane + 3 workers.
# The control-plane node is labeled ingress-ready and maps host ports 80/443
# so ingress-nginx can be reached at http://localhost without extra port-forwards.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
  - role: worker
