# Runs migrate.sh (flask db upgrade + seed) as an ArgoCD PostSync hook: it
# runs after the main Sync phase, so the namespace/CNPG cluster/configmaps are
# already applied and live by the time this Job starts.
# hook-delete-policy BeforeHookCreation deletes the previous run's Job first —
# Job pod templates are immutable, so once the image tag changes a plain
# `kubectl apply` (or `Replace=true`, which does a raw PUT and drops the
# auto-generated immutable spec.selector) fails; delete-then-create sidesteps
# that entirely.
# The wait-loop below is the real safety net regardless of hook ordering: it
# blocks until Postgres actually accepts connections before running migrate.sh.
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migration
  namespace: quiz-app
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: backend-migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: apaliwal14/augk8s26-backend:fix-scram
          command:
            - /bin/bash
            - -c
            - |
              set -e
              until PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" -d "$DB_NAME" -c "SELECT 1" >/dev/null 2>&1; do
                echo "Waiting for Postgres at $DB_HOST:$DB_PORT..."
                sleep 3
              done
              echo "Postgres is up, running migrations..."
              ./migrate.sh
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SECRET_KEY
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_NAME
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
