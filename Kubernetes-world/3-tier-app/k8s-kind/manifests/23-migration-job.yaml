# Runs migrate.sh (flask db upgrade + seed) once before backend/frontend come up.
# sync-wave "0" puts it after the namespace/Postgres cluster (waves -2/-1) and
# before the backend/frontend Deployments (wave 1).
# sync-options Replace=true: Job pod templates are immutable, so a normal
# `kubectl apply` on re-sync would fail once the image tag changes. Replace
# tells ArgoCD to delete+recreate the Job instead.
# The wait-loop below is the real safety net: it doesn't matter whether CNPG
# reports "Ready" by the time this wave starts, the Job just blocks until the
# primary actually accepts connections.
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migration
  namespace: quiz-app
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: backend-migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: apaliwal14/augk8s26-backend:1a4d72e
          command:
            - /bin/bash
            - -c
            - |
              set -e
              until PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" -d "$DB_NAME" -c "SELECT 1" >/dev/null 2>&1; do
                echo "Waiting for Postgres at $DB_HOST:$DB_PORT..."
                sleep 3
              done
              echo "Postgres is up, running migrations..."
              ./migrate.sh
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SECRET_KEY
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_NAME
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
