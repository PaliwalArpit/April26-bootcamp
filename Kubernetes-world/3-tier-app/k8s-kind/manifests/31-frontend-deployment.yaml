apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: quiz-app
  labels:
    app: frontend
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  # See backend-deployment.yaml for why this must be Recreate, not
  # RollingUpdate, now that all replicas are dedicated to one node.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # 3-tier-app-worker is tainted dedicated=frontend:NoSchedule and labeled
      # workload=frontend (see deploy.sh). Toleration permits scheduling past
      # the taint; nodeSelector is what actually attracts these pods there.
      # All 3 replicas land together on this one node by design.
      nodeSelector:
        workload: frontend
      tolerations:
      - key: dedicated
        operator: Equal
        value: frontend
        effect: NoSchedule
      containers:
      - name: frontend
        image: apaliwal14/augk8s26-frontend:1a4d72e
        ports:
        - containerPort: 80

        env:
        - name: BACKEND_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: BACKEND_URL

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
